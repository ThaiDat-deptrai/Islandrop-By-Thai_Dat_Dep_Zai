plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.islanddrop'
    compileSdk 36

    defaultConfig {
        applicationId 'vn.islanddrop'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '1.3.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
